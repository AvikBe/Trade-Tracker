[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradetracker"
version = "0.1.0"
description = "Insider (Form 4) and Congress trade tracker ranked by disclosure promptness"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2", "scipy>=1.11"]  # pandas, scipy: cross-check scripts
ml = ["numpy>=1.26", "pandas>=2", "lightgbm>=4.3", "shap>=0.45"]  # tt ml-study

[project.scripts]
tt = "tradetracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real SEC and Tiingo APIs (TT_LIVE=1)"]
